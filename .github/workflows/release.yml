name: Release

# Релиз собирается на GitHub по тегу версии: git tag v0.4.0 && git push origin v0.4.0.
# Версия в теге обязана совпадать с <Version> в Velocity.App.csproj, иначе сборка остановится:
# программа сравнивает свою версию с релизом, и расхождение сломало бы автообновление.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Installer and GitHub release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Version from tag
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $csproj = Get-Content src/Velocity.App/Velocity.App.csproj -Raw
          if ($csproj -notmatch "<Version>$([regex]::Escape($version))</Version>") {
            throw "Version in Velocity.App.csproj does not match tag $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish single-file app
        run: dotnet publish src/Velocity.App/Velocity.App.csproj --configuration Release --output dist-app

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
          }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" installer/velocity.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }

      - name: Release notes and checksum
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $file = "release/velocity-setup-$version.exe"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash
          $notes = "docs/releases/v$version.md"
          $body = if (Test-Path $notes) { Get-Content $notes -Raw -Encoding utf8 } else { "" }
          $body += "`n`n**SHA256** ``velocity-setup-$version.exe``:`n`n``$hash``"
          Set-Content -Path release-notes.md -Value $body -Encoding utf8

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: VELOCITY ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: release/velocity-setup-${{ steps.version.outputs.version }}.exe
